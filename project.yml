name: Notchka
options:
  bundleIdPrefix: kz.mobilefirst
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  NotchKit:
    path: Packages/NotchKit

targets:
  Notchka:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: NotchKit
        product: NotchCore
      - package: NotchKit
        product: NotchUI
      - package: NotchKit
        product: MediaBridge
      - package: NotchKit
        product: NotchStore
      - package: NotchKit
        product: ClipboardKit
      - package: NotchKit
        product: StashKit
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Notchka
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.mobilefirst.notchka
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # Ad-hoc здесь — намеренно generic-умолчание для чужой машины: у
        # клонировавшего репозиторий нет ни моего сертификата, ни моей
        # команды, и жёстко забитая личная подпись просто не собралась бы.
        #
        # Локально, для себя, это не то, чем стоит пользоваться: ad-hoc
        # меняет отпечаток при каждой пересборке, а macOS привязывает
        # выданное разрешение Accessibility именно к отпечатку — разрешение
        # пришлось бы выдавать заново после каждой сборки. Для стабильной
        # локальной подписи передавай CODE_SIGN_IDENTITY/DEVELOPMENT_TEAM
        # аргументами `xcodebuild ... CODE_SIGN_IDENTITY=... DEVELOPMENT_TEAM=...`
        # — они переопределяют это значение поверх сгенерированного проекта,
        # и личная подпись при этом никогда не попадает в git.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: YES
        PROVISIONING_PROFILE_SPECIFIER: ""
        # YES для Release: обязательное условие нотаризации Apple — без
        # усиленного runtime notarytool отклонит сборку ещё на этапе приёма.
        # NO для Debug — сборка для локальной отладки под ним не нуждается.
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
