name: Notchka
options:
  bundleIdPrefix: kz.mobilefirst
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  NotchKit:
    path: Packages/NotchKit

targets:
  Notchka:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: NotchKit
        product: NotchCore
      - package: NotchKit
        product: NotchUI
      - package: NotchKit
        product: MediaBridge
      - package: NotchKit
        product: NotchStore
      - package: NotchKit
        product: ClipboardKit
      - package: NotchKit
        product: StashKit
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Notchka
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.mobilefirst.notchka
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # Ad-hoc here is an intentional generic default for someone else's
        # machine: whoever clones the repo has neither my certificate nor my
        # team, and a hardcoded personal signature simply wouldn't build.
        #
        # Locally, for yourself, this isn't something you should use: ad-hoc
        # changes the fingerprint on every rebuild, and macOS ties the
        # granted Accessibility permission to that exact fingerprint — the
        # permission would have to be granted again after every build. For a
        # stable local signature, pass CODE_SIGN_IDENTITY/DEVELOPMENT_TEAM as
        # arguments to `xcodebuild ... CODE_SIGN_IDENTITY=... DEVELOPMENT_TEAM=...`
        # — they override this value on top of the generated project, and
        # your personal signature never ends up in git.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: YES
        PROVISIONING_PROFILE_SPECIFIER: ""
        # YES for Release: a required condition for Apple notarization —
        # without the hardened runtime, notarytool will reject the build
        # right at the intake stage.
        # NO for Debug — a local debug build doesn't need it.
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
